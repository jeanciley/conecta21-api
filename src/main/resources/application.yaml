spring:
  mail:
    host: ${MAIL_HOST:${SMTP_HOST:localhost}}
    port: ${MAIL_PORT:${SMTP_PORT:1025}}
    username: ${MAIL_USERNAME:${SMTP_USERNAME:}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:${SMTP_AUTH:false}}
          starttls:
            enable: ${MAIL_STARTTLS:${SMTP_STARTTLS:false}}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 64MB
  datasource:
    url: jdbc:mysql://localhost:3306/conecta21?serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

api:
  security:
    token:
      secret: ${JWT_SECRET:minha_senha_secreta_super_segura_123}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5500}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@conecta21.local}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/conecta21?serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}

api:
  security:
    token:
      secret: ${JWT_SECRET:minha_senha_secreta_super_segura_123}

app:
  mail:
    from: ${MAIL_FROM:no-reply@conecta21.local}
  arquivos:
    diretorio: ${ARQUIVOS_DIRETORIO:uploads/chamados}
